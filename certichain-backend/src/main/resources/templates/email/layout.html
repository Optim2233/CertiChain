<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="margin:0;padding:0;background:#f0f3f8;font-family:Arial,Helvetica,sans-serif">
<span th:text="${preheader}" style="display:none;max-height:0;overflow:hidden;mso-hide:all"></span>
<center>
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f3f8;padding:24px 12px"><tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%">
<!-- header -->
<tr><td style="background:#02275A;border-radius:12px 12px 0 0;padding:16px 24px">
<table width="100%" cellpadding="0" cellspacing="0"><tr>
<td><table cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr>
<td style="padding-right:10px"><a th:href="${frontendUrl}" style="text-decoration:none">
<img th:src="${logoUrl}" alt="CertiChain" width="31" height="36" style="display:block;border:0;background:#fff;border-radius:8px;padding:4px"/>
</a></td>
<td><a th:href="${frontendUrl}" style="text-decoration:none;color:#fff;font-weight:800;font-size:15px;letter-spacing:0.2px">CertiChain</a></td>
</tr></table></td>
<td align="right" style="color:#d5e3ff;font-size:11px;letter-spacing:0.8px">DIGITAL CERTIFICATE WALLET</td>
</tr></table>
</td></tr>
<!-- body -->
<tr><td style="background:#ffffff;border:1px solid #e6e8ec;border-top:none;border-radius:0 0 12px 12px;padding:32px 28px">
<div th:replace="${content}"></div>
</td></tr>
<!-- footer -->
<tr><td style="padding:16px 8px;text-align:center;color:#75777f;font-size:11px;line-height:1.6">
CertiChain &middot; noreply &mdash; do not reply to this automated message.<br/>
<a th:href="${frontendUrl}" th:text="${frontendUrl}" style="color:#0462BA;text-decoration:none"></a>
</td></tr>
</table>
</td></tr></table>
</center>
</body>
</html>
