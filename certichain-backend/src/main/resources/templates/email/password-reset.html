<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::content})}">
<body><div th:fragment="content">
<h1 style="margin:0 0 8px;color:#02275A;font-size:22px;font-weight:800">Reset your password</h1>
<p style="margin:0 0 20px;color:#44474e;font-size:14px;line-height:1.6">You requested a password reset. Click the button below — it expires in <b>30 minutes</b>. If you didn't request this, ignore this email.</p>
<p style="margin:0 0 20px"><a th:href="${resetLink}" style="display:inline-block;background:#0462BA;color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:700;font-size:14px">Reset password</a></p>
<p style="margin:0;color:#75777f;font-size:12px;word-break:break-all">Or copy this link:<br/><a th:href="${resetLink}" th:text="${resetLink}" style="color:#0462BA"></a></p>
</div></body></html>
