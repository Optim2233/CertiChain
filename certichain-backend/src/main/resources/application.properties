spring.config.import=optional:file:.env[.properties]

spring.application.name=certichain-backend

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Neon's pooled endpoint occasionally drops a connection mid-handshake when its compute
# is waking from auto-suspend (PSQLException/EOFException during the very first connect).
# Hikari fails the whole pool - and Flyway/JPA startup with it - on a single bad attempt
# by default. A negative initialization-fail-timeout makes Hikari retry connection attempts
# in the background instead of failing startup on the first flaky one; connectionTimeout
# bounds each individual attempt. Pooled connections are also kept short-lived so a stale
# one from before a compute suspend is never handed out mid-request.
#
# keepalive-time was 120000 (2min) - too loose for local dev, where the whole pool can go
# idle and Neon's free-tier compute can suspend well inside that window (observed ~68s).
# Shortened to ping every 30s so a suspend is caught and the connection recycled before a
# real request ever tries to use it, instead of Hikari discovering it's dead mid-request
# and timing out (the "Connection is not available" CannotCreateTransactionException).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
# Pool deliberately small: one backend against a free-tier Neon pooler doesn't need ten
# connections, and the keepalive above pings every idle one every 30s just to hold it open.
# Hikari's default is max 10 / min-idle 10, i.e. ten warm connections held permanently.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
# Setting minimum-idle below maximum-pool-size turns on Hikari's idle reaper, whose
# 600s default is longer than the max-lifetime above - Hikari then warns and disables
# it. Keep it under max-lifetime so idle connections retire on schedule instead.
spring.datasource.hikari.idle-timeout=180000
# Surfaces a connection borrowed and never returned, rather than silently starving the pool.
spring.datasource.hikari.leak-detection-threshold=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# The shared dev database has migrations 7-9 applied (audit log share id, credential
# expiry, notifications) whose .sql files were never committed to this checkout - Flyway
# otherwise hard-fails validation over "applied migration not resolved locally" before it
# ever gets to running V10/V11 below. Doesn't affect which migrations actually run, only
# whether Flyway tolerates history it can't see the source of.
spring.flyway.ignore-migration-patterns=*:missing
# Flyway opens its own JDBC connection at startup (separate from the Hikari pool below),
# so it needs its own retry: Neon's pooled endpoint occasionally drops the very first
# connection mid-handshake while its compute wakes from auto-suspend. connect-retries
# retries the whole connection attempt rather than failing startup outright.
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=5

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# Currently a local redis-server; REDIS_URL points at Upstash in deployment, where these
# matter. Without them every Lettuce timeout is at its (generous) default, so a hung Redis
# stalls request threads. Kept short on purpose: the cache is an optimisation, and
# CacheConfig's error handler turns any failure into a miss rather than an error.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.lettuce.shutdown-timeout=200ms

# Gmail SMTP via App Password (Google Account → 2FA → App passwords → Mail, 16 chars).
# GMAIL_ADDRESS is the official noreply address, GMAIL_APP_PASSWORD is the app password (spaces stripped).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_ADDRESS:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:CertiChain <${GMAIL_ADDRESS}>}
certichain.email.logo-url=${EMAIL_LOGO_URL:${certichain.frontend-url}/certichain-shield.svg}

certichain.jwt.secret=${JWT_SECRET:test-only-please-set-JWT_SECRET-env-var-32chars!}
certichain.signing.interim-hmac-secret=${SIGNING_HMAC_SECRET:test-only-please-set-SIGNING_HMAC-32chars!}

# false for local http:// dev (Secure cookies are dropped over plain HTTP);
# set to true on Railway/prod, where frontend and backend are on different
# HTTPS origins and the auth cookie must be SameSite=None; Secure to be sent
# cross-site at all.
certichain.cookie.cross-site=${COOKIE_CROSS_SITE:false}

supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:institution-profiles}
# Separate, private bucket for registration documents (DICA cert, tax clearance, MIC
# permit, establishment doc) - these hold real PII/business identity docs, encrypted
# under the institution's DEK before upload. Never make this bucket public.
supabase.documents-bucket=${SUPABASE_DOCUMENTS_BUCKET:institution-documents}

certichain.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Public base for emailed links (password reset), notification CTAs and the email logo.
# Defaults to the frontend URL for dev; prod MUST set EMAIL_PUBLIC_BASE_URL to the real
# public origin - LAN IPs are unreachable from mail clients.
certichain.email.base-url=${EMAIL_PUBLIC_BASE_URL:${certichain.frontend-url:http://localhost:3000}}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=20MB
# Legacy flat Page JSON (totalElements/number/size at top level). The frontend's
# shared Page<T> type and Pager component read that shape; `via-dto` nests it under
# a `page` object and breaks every paged list + the AA dashboard counts. The
# round-trip concern that motivated via-dto only applied to @Cacheable paged
# queries, which no longer exist.
spring.data.web.pageable.serialization-mode=direct

# Timeline/audit JSON payloads shrink ~70% on the wire for the cost of a few
# ms of server CPU - pure win on the Neon pooler link.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/css,application/javascript
server.compression.min-response-size=1KB
# Must decode to exactly 32 UTF-8 bytes (AES-256) - EnvelopeEncryptionServiceImpl fails
# fast at startup otherwise. Real deployments must override via ENCRYPTION_KEK.
certichain.encryption.kek=${ENCRYPTION_KEK:DEV_ONLY_KEK_DO_NOT_USE_IN_PROD!}
# HMAC key for the encrypted-email blind index (exact-match lookups on users.email /
# credential.graduate_email). At least 32 UTF-8 bytes - PiiCryptoService fails fast
# otherwise. Must be independent from the KEK (signing vs decrypting, separate rotation).
certichain.encryption.hmac-key=${ENCRYPTION_HMAC_KEY:DEV_ONLY_HMAC_KEY_DO_NOT_USE_IN_PROD_!}
# One-time legacy-encryption backfill: mints DEKs for approved institutions that predate
# encryption, re-wraps existing DEKs (BACKFILL_PREVIOUS_KEK = the key they were wrapped
# under), and encrypts every credential_field that still holds plaintext. Run once per
# environment with the flag true, then leave it off. See V21/V22 for the promise this keeps.
app.backfill.legacy-encryption=${BACKFILL_LEGACY_ENCRYPTION:false}
app.backfill.previous-kek=${BACKFILL_PREVIOUS_KEK:}
# One-time PII backfill (PiiBackfill): encrypts pre-existing user/institution PII,
# emails (+HMAC index), dispute text, notification bodies and legacy PDFs. Run once per
# environment with the flag true (after V23), then leave it off. Re-run safe (skips rows
# it already finished).
app.backfill.pii-encryption=${BACKFILL_PII_ENCRYPTION:false}
# One-time backfill: downloads institution registration documents (establishment doc,
# DICA cert, tax clearance, MIC permit) still pointing at the old public Supabase bucket,
# encrypts them under the owning institution's DEK, and re-uploads to the private
# institution-documents bucket. Run once per environment with the flag true, then leave
# it off. Re-run safe (already-migrated rows hold a bare path, not a URL, and are skipped).
app.backfill.legacy-documents=${BACKFILL_LEGACY_DOCUMENTS:false}
# One-time backfill: mints RSA signing keypairs for institutions approved before
# per-institution signing shipped (their existing credentials keep verifying via the
# legacy HMAC fallback; new issuances are RSA). Run once per environment with the flag
# true, then leave it off. Re-run safe (already-keyed institutions are skipped).
app.backfill.signing-keys=${BACKFILL_SIGNING_KEYS:false}

# On-chain anchoring (Ethereum Sepolia): a scheduled zero-value self-transaction whose
# data field is the current ledger head hash, so even a fully-compromised backend cannot
# undetectably rewrite history - the anchor lives on a public chain it doesn't control.
# Dormant unless ANCHOR_ENABLED=true; the private key must be a throwaway wallet funded
# with a little Sepolia test ETH (free from any faucet). Switching to mainnet means
# changing rpc-url, chainId and the explorer URL in LedgerAnchorService/LedgerStatus.
app.anchor.enabled=${ANCHOR_ENABLED:false}
app.anchor.rpc-url=${SEPOLIA_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
app.anchor.private-key=${ANCHOR_PRIVATE_KEY:}

# Email sends are @Async and swallow their failures (so an SMTP outage never breaks the
# request that triggered it), which made a dead mail pipeline invisible from outside.
# EmailHealthIndicator now drives /actuator/health to DOWN once a send has failed, so
# uptime monitoring catches it; the per-message detail is in the ERROR log.
# Details stay hidden: /actuator/health is permitAll, so itemising components there would
# publish DB/Redis internals anonymously. See audit/findings.md #2.
management.endpoints.web.exposure.include=health,info
