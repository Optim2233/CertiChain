spring.config.import=optional:file:.env[.properties]

spring.application.name=certichain-backend

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Resend HTTP API for notification emails, not raw SMTP - SMTP (25/465/587) is
# routinely blackholed by home routers/ISPs as an anti-spam-relay measure
# (confirmed on this project's dev network: every SMTP port timed out while
# HTTPS worked instantly). RESEND_API_KEY comes from resend.com's dashboard.
# EmailServiceImpl skips sending entirely when it's blank, so a missing key
# degrades to "in-app notifications only" rather than breaking requests.
resend.api-key=${RESEND_API_KEY:}
# resend.dev's shared sending domain - fine for dev/testing without verifying
# your own domain. Swap to a verified domain address before relying on this
# for real deliverability (resend.dev sends can be rate-limited/flagged).
resend.from=${RESEND_FROM:CertiChain <onboarding@resend.dev>}

certichain.jwt.secret=${JWT_SECRET:test-only-please-set-JWT_SECRET-env-var-32chars!}
certichain.signing.interim-hmac-secret=${SIGNING_HMAC_SECRET:test-only-please-set-SIGNING_HMAC-32chars!}

# false for local http:// dev (Secure cookies are dropped over plain HTTP);
# set to true on Railway/prod, where frontend and backend are on different
# HTTPS origins and the auth cookie must be SameSite=None; Secure to be sent
# cross-site at all.
certichain.cookie.cross-site=${COOKIE_CROSS_SITE:false}

supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:institution-profiles}

certichain.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=20MB
spring.data.web.pageable.serialization-mode=via-dto
