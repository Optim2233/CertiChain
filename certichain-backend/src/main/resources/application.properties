spring.config.import=optional:file:.env[.properties]

spring.application.name=certichain-backend

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Gmail SMTP for notification emails - MAIL_USERNAME is the full gmail address,
# MAIL_APP_PASSWORD is a Google App Password (not the account password).
# EmailServiceImpl swallows send failures, so a missing/bad app password
# degrades to "in-app notifications only" rather than breaking requests.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

certichain.jwt.secret=${JWT_SECRET:CHANGE_ME_DEV_ONLY_MIN_32_CHARS_LONG_PLEASE}
certichain.signing.interim-hmac-secret=${SIGNING_HMAC_SECRET:CHANGE_ME_DEV_ONLY_INTERIM_HMAC_SECRET_32B}

# false for local http:// dev (Secure cookies are dropped over plain HTTP);
# set to true on Railway/prod, where frontend and backend are on different
# HTTPS origins and the auth cookie must be SameSite=None; Secure to be sent
# cross-site at all.
certichain.cookie.cross-site=${COOKIE_CROSS_SITE:false}
