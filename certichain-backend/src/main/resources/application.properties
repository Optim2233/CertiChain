spring.config.import=optional:file:.env[.properties]

spring.application.name=certichain-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# The shared dev database has migrations 7-9 applied (audit log share id, credential
# expiry, notifications) whose .sql files were never committed to this checkout - Flyway
# otherwise hard-fails validation over "applied migration not resolved locally" before it
# ever gets to running V10/V11 below. Doesn't affect which migrations actually run, only
# whether Flyway tolerates history it can't see the source of.
spring.flyway.ignore-migration-patterns=*:missing

certichain.jwt.secret=${JWT_SECRET:CHANGE_ME_DEV_ONLY_MIN_32_CHARS_LONG_PLEASE}
certichain.signing.interim-hmac-secret=${SIGNING_HMAC_SECRET:CHANGE_ME_DEV_ONLY_INTERIM_HMAC_SECRET_32B}
# Must decode to exactly 32 UTF-8 bytes (AES-256) - EnvelopeEncryptionServiceImpl fails
# fast at startup otherwise. Real deployments must override via ENCRYPTION_KEK.
certichain.encryption.kek=${ENCRYPTION_KEK:DEV_ONLY_KEK_DO_NOT_USE_IN_PROD!}
