# Test profile: no external infra. Redis-backed @Cacheable is switched to an
# in-JVM no-op so web-layer and slice tests need neither Upstash nor Docker.
# Full integration tests (Testcontainers Postgres) come in a later phase and
# will layer their own datasource config on top of this.
spring.cache.type=none
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration

certichain.jwt.secret=test-only-secret-value-at-least-32-characters-long
certichain.signing.interim-hmac-secret=test-only-signing-hmac-secret-32-bytes-min
