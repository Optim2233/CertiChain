<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Institution seal">
  <!-- Default institution mark: the CertiChain rosette motif in navy/gold.
       Used as the final fallback when an institution has no logo (Supabase and
       local both miss). Deterministic, license-clean, matches the app identity. -->
  <circle cx="64" cy="64" r="60" fill="#02275A"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#c9a85c" stroke-width="2" stroke-dasharray="2 5"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#d5e3ff" stroke-width="1"/>
  <!-- open book -->
  <path d="M40 76 C48 70 56 70 64 74 C72 70 80 70 88 76 L88 84 C80 78 72 78 64 82 C56 78 48 78 40 84 Z" fill="#d5e3ff"/>
  <path d="M64 74 L64 82" stroke="#02275A" stroke-width="1.5"/>
  <!-- graduation cap above the book -->
  <path d="M38 58 L64 46 L90 58 L64 70 Z" fill="#c9a85c"/>
  <path d="M82 60 L82 70 C82 73 76 75 72 74" fill="none" stroke="#c9a85c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="72" cy="74" r="2.4" fill="#c9a85c"/>
  <!-- three laurel points -->
  <circle cx="52" cy="40" r="1.6" fill="#c9a85c"/>
  <circle cx="64" cy="37" r="1.6" fill="#c9a85c"/>
  <circle cx="76" cy="40" r="1.6" fill="#c9a85c"/>
</svg>
