<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" role="img" aria-label="CertiChain">
<!-- Navy shield enclosing a chain ring and a sealed certificate, after
     Designs/CertiChainLogo.jpg. Deliberately chunky: this is rendered at 24px in the
     portal sidebar and inside email clients, where hairlines vanish. -->
<path fill="#02275A" d="M60 8 L106 29 L106 73 C106 99 85 120 60 133 C35 120 14 99 14 73 L14 29 Z"/>

<!-- chain ring around the certificate: four thick arcs + joints -->
<g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
  <path d="M40 34 C29 40 23 51 25 63"/>
  <path d="M80 34 C91 40 97 51 95 63"/>
  <path d="M26 74 C30 86 39 95 51 99"/>
  <path d="M94 74 C90 86 81 95 69 99"/>
</g>
<g fill="#fff">
  <circle cx="25" cy="68.5" r="5.5"/>
  <circle cx="95" cy="68.5" r="5.5"/>
  <circle cx="60" cy="101" r="5.5"/>
</g>

<!-- certificate sheet -->
<rect x="39" y="47" width="42" height="32" rx="3.5" fill="#fff"/>
<g stroke="#02275A" stroke-width="3.4" stroke-linecap="round">
  <path d="M47 57 H73"/>
  <path d="M47 65 H67"/>
</g>
<!-- rosette seal, tucked into the sheet's lower-right corner like the source -->
<circle cx="74" cy="74" r="10" fill="#02275A"/>
<circle cx="74" cy="74" r="7" fill="#fff"/>
<circle cx="74" cy="74" r="3.2" fill="#02275A"/>
</svg>
